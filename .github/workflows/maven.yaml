name: Java CI with Maven

on:
  pull_request:
    branches: [main]
  # builds on main save the Maven cache in the scope of the default branch, which pull requests can restore
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up the JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github
      # the release bumps versions in pom.xml, so exact cache keys rarely match; restore the most recent cache instead
      - name: Cache Maven artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Configure Problem Matchers
        run: |
          echo "::add-matcher::.github/problem-matcher.json"
          echo "::remove-matcher owner=java::"

      - name: Build with Maven
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: ./mvnw -B package

      # tests run the plugin on the same classpath as Trino, so also check that it works in a Trino server,
      # using the automatic token, which is also available in pull requests from forks
      - name: Test the Docker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./docker-build.sh
          VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          docker run -d --name trino-openapi -e GITHUB_TOKEN "nineinchnick/trino-openapi:$VERSION"
          timeout 300 sh -c 'until docker logs trino-openapi 2>&1 | grep -q "SERVER STARTED"; do sleep 5; done'
          docker exec trino-openapi trino --execute "SELECT login FROM github.default.orgs WHERE org = 'trinodb'" | tee result.txt
          grep -qx '"trinodb"' result.txt || { docker logs trino-openapi; exit 1; }

      - name: Annotate run
        uses: trinodb/github-actions/action-surefire-report@b63800bedfbc7ab1ff2e5fe7eaecf5ab82ce6a70
        if: always()
        with:
          fail_if_no_tests: false
          skip_publishing: true
