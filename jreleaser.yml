project:
  name: trino-openapi
  description: This is a Trino connector
  license: Apache-2
  java:
    groupId: pl.net.was
    version: 17
  authors:
    - Jan Waś
  extraProperties:
    inceptionYear: 2021

files:
  artifacts:
    - path: "target/{{projectName}}-{{projectVersion}}.zip"

release:
  github:
    owner: nineinchnick
    changelog:
      formatted: ALWAYS
      format: "{{commitShortHash}} {{commitTitle}}"
      content: |
        Built for Trino {{Env.TRINO_VERSION}}

        ## Changelog

        {{changelogChanges}}
