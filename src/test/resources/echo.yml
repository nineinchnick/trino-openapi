openapi: 3.0.3
info:
  title: Echo
  description: Endpoints of the FastAPI test server, described by hand to verify how parameters and request bodies are serialized
  version: 0.1.0
paths:
  /echo/path/{value}:
    get:
      parameters:
        - in: path
          name: value
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/path_array/{values}:
    get:
      parameters:
        - in: path
          name: values
          required: true
          schema:
            $ref: '#/components/schemas/Strings'
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/label/{values}:
    get:
      parameters:
        - in: path
          name: values
          required: true
          style: label
          schema:
            $ref: '#/components/schemas/Strings'
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/matrix/{values}:
    get:
      parameters:
        - in: path
          name: values
          required: true
          style: matrix
          explode: true
          schema:
            $ref: '#/components/schemas/Strings'
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/path_object/{color}:
    get:
      parameters:
        - in: path
          name: color
          required: true
          explode: true
          schema:
            $ref: '#/components/schemas/Color'
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/decimals/{values}:
    get:
      parameters:
        - in: path
          name: values
          required: true
          schema:
            $ref: '#/components/schemas/Decimals'
        - in: query
          name: value
          schema:
            type: number
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/union_query:
    get:
      parameters:
        - in: query
          name: values
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StringOrInteger'
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/union_write:
    post:
      parameters:
        - in: query
          name: value
          schema:
            $ref: '#/components/schemas/StringOrInteger'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo_last_post:
    get:
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/query:
    get:
      parameters:
        - in: query
          name: value
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/defaults:
    get:
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            maximum: 100
        - in: query
          name: archived
          schema:
            type: boolean
        - in: header
          name: x-color
          schema:
            type: string
            enum: [red, green]
        - in: cookie
          name: flavor
          schema:
            type: string
      x-trino:
        parameterDefaults:
          limit: 100
          archived: false
          x-color: green
          flavor: mint
      responses:
        "200":
          $ref: '#/components/responses/Echo'
    post:
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
      x-trino:
        parameterDefaults:
          limit: 10
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/query_reserved:
    get:
      parameters:
        - in: query
          name: value
          allowReserved: true
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/query_object:
    get:
      parameters:
        - in: query
          name: color
          schema:
            $ref: '#/components/schemas/Color'
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/deep_object:
    get:
      parameters:
        - in: query
          name: color
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/Color'
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/header_object:
    get:
      parameters:
        - in: header
          name: x-color
          explode: true
          schema:
            $ref: '#/components/schemas/Color'
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo/cookie_object:
    get:
      parameters:
        - in: cookie
          name: color
          explode: false
          schema:
            $ref: '#/components/schemas/Color'
      responses:
        "200":
          $ref: '#/components/responses/Echo'
  /echo_map:
    post:
      # it only reads data, but POST operations are used for INSERT, unless marked otherwise
      x-trino:
        sqlOperation: select
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapEcho'
      responses:
        '200':
          description: The request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapEcho'
  /echo_union_value:
    post:
      # it only reads data, but POST operations are used for INSERT, unless marked otherwise
      x-trino:
        sqlOperation: select
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnionValueEcho'
      responses:
        '200':
          description: The request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnionValueEcho'
  # the server returns any request body as-is
  /echo_numbers:
    post:
      # it only reads data, but POST operations are used for INSERT, unless marked otherwise
      x-trino:
        sqlOperation: select
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllOfArrayEcho'
      responses:
        '200':
          description: The request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllOfArrayEcho'
  /user_views/{username}:
    get:
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Views of the user or an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserViewsResponseOrError'
components:
  responses:
    Echo:
      description: The raw request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Echo'
  schemas:
    Echo:
      type: object
      properties:
        path:
          type: string
        query:
          type: string
        header:
          type: string
          nullable: true
        cookie:
          type: string
          nullable: true
    Strings:
      type: array
      items:
        type: string
    StringOrInteger:
      oneOf:
        - type: string
        - type: integer
    Decimals:
      type: array
      items:
        type: number
    Color:
      type: object
      properties:
        r:
          type: integer
        name:
          type: string
    MapEcho:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: integer
    UnionValueEcho:
      type: object
      properties:
        value:
          oneOf:
            - type: integer
            - type: object
              additionalProperties:
                type: integer
    AllOfArrayEcho:
      type: object
      properties:
        tags:
          allOf:
            - $ref: '#/components/schemas/Strings'
    UserViewsResponseOrError:
      oneOf:
        - $ref: '#/components/schemas/UserViewsResponse'
        - $ref: '#/components/schemas/Error'
    UserViewsResponse:
      type: object
      required:
        - views
      properties:
        views:
          type: array
          items:
            type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
