connector.name=openapi
spec-location=${ENV:OPENAPI_SPEC_LOCATION}
spec-location.authentication=${ENV:OPENAPI_SPEC_AUTHENTICATION}
base-uri=${ENV:OPENAPI_BASE_URI}
trimmed-path-prefixes=${ENV:OPENAPI_TRIMMED_PATH_PREFIXES}
authentication.type=${ENV:OPENAPI_AUTH_TYPE}
authentication.scheme=${ENV:OPENAPI_AUTH_SCHEME}
authentication.client-id=${ENV:OPENAPI_CLIENT_ID}
authentication.client-secret=${ENV:OPENAPI_CLIENT_SECRET}
authentication.client-auth-method=${ENV:OPENAPI_CLIENT_AUTH_METHOD}
authentication.token-url=${ENV:OPENAPI_TOKEN_URL}
authentication.allow-insecure-http=${ENV:OPENAPI_ALLOW_INSECURE_HTTP}
authentication.username=${ENV:OPENAPI_USERNAME}
authentication.password=${ENV:OPENAPI_PASSWORD}
authentication.bearer-token=${ENV:OPENAPI_BEARER_TOKEN}
authentication.api-key-name=${ENV:OPENAPI_API_KEY_NAME}
authentication.api-key-value=${ENV:OPENAPI_API_KEY_VALUE}
authentication.api-keys=${ENV:OPENAPI_API_KEYS}
max-requests-per-second=${ENV:OPENAPI_MAX_REQUESTS_PER_SECOND}
max-splits-per-second=${ENV:OPENAPI_MAX_SPLITS_PER_SECOND}
max-retries=${ENV:OPENAPI_MAX_RETRIES}
retry-initial-delay=${ENV:OPENAPI_RETRY_INITIAL_DELAY}
retry-max-delay=${ENV:OPENAPI_RETRY_MAX_DELAY}
domain-expansion-limit=${ENV:OPENAPI_DOMAIN_EXPANSION_LIMIT}
http-cache.directory=${ENV:OPENAPI_HTTP_CACHE_DIRECTORY}
http-cache.max-size=${ENV:OPENAPI_HTTP_CACHE_MAX_SIZE}
http-cache.max-entry-size=${ENV:OPENAPI_HTTP_CACHE_MAX_ENTRY_SIZE}
split-strategy=${ENV:OPENAPI_SPLIT_STRATEGY}
probe-limit=${ENV:OPENAPI_PROBE_LIMIT}
