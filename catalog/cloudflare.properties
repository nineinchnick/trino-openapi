connector.name=openapi
# a copy of https://raw.githubusercontent.com/cloudflare/api-schemas/main/openapi.json
# without values the OpenAPI parser rejects, see dev/specs/README.md
spec-location=/etc/trino/specs/cloudflare.json
base-uri=https://api.cloudflare.com/client/v4
authentication.type=http
authentication.scheme=bearer
authentication.bearer-token=${ENV:CLOUDFLARE_API_TOKEN}
